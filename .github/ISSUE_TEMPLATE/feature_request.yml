name: Proponi una funzione
description: Suggerisci un miglioramento per Domus UI
title: "[Idea]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema da risolvere
      description: Spiega il bisogno dell'utente, non soltanto la soluzione immaginata.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Esperienza proposta
      description: Descrivi flusso, dispositivi e breakpoint interessati.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative considerate
  - type: checkboxes
    id: checks
    attributes:
      label: Verifiche
      options:
        - label: Ho controllato roadmap e issue esistenti.
          required: true
